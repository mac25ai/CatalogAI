{# Floating chatbot button + slide-up chat window. Included by base.html. #}

<div id="chatbot-data" class="hidden"
     data-slug="{{ slug }}"
     data-greeting="{{ business.chatbot_greeting }}"
     data-whatsapp="{{ business.whatsapp_number }}"></div>

<!-- Floating chatbot button (above the WhatsApp button) -->
<button onclick="toggleChatbot()" aria-label="Open chat with {{ business.chatbot_name }}"
        class="fixed bottom-24 right-6 z-50 rounded-full p-4 shadow-lg text-white min-h-[56px] min-w-[56px] flex items-center justify-center"
        style="background-color: var(--primary)">
  <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H8.25m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H12m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 0 1-2.555-.337A5.972 5.972 0 0 1 5.41 20.97a5.969 5.969 0 0 1-.474-.065 4.48 4.48 0 0 0 .978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25Z"/>
  </svg>
</button>

<!-- Chat window -->
<div id="chatbot-window"
     class="hidden fixed bottom-0 right-0 left-0 sm:left-auto sm:bottom-24 sm:right-6 z-50 sm:w-96 sm:max-w-[calc(100vw-3rem)] bg-white sm:rounded-2xl shadow-2xl border border-gray-200 flex flex-col overflow-hidden chatbot-slide-up"
     style="height: min(480px, 80vh)">

  <!-- Header -->
  <div class="flex items-center justify-between px-4 py-3 text-white flex-shrink-0"
       style="background-color: var(--primary)">
    <div class="flex items-center gap-2">
      <span class="w-2.5 h-2.5 rounded-full bg-green-400 animate-pulse"></span>
      <p class="font-semibold text-sm">{{ business.chatbot_name }}</p>
    </div>
    <button onclick="toggleChatbot()" aria-label="Close chat"
            class="p-2 rounded-full hover:bg-white/10 min-h-[44px] min-w-[44px] flex items-center justify-center">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <!-- Message thread -->
  <div id="chatbot-thread" class="flex-1 overflow-y-auto p-4 bg-gray-50"></div>

  <!-- Input -->
  <div class="flex items-center gap-2 p-3 border-t border-gray-200 bg-white flex-shrink-0">
    <input type="text" id="chatbot-input" placeholder="Type your message…" autocomplete="off"
           class="flex-1 border border-gray-300 rounded-full px-4 py-2.5 text-sm focus:outline-none focus:ring-2 min-h-[44px]">
    <button onclick="sendMessage()" aria-label="Send message"
            class="text-white rounded-full p-3 min-h-[44px] min-w-[44px] flex items-center justify-center"
            style="background-color: var(--primary)">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5"/>
      </svg>
    </button>
  </div>
</div>

<script src="/static/js/chatbot.js" defer></script>
