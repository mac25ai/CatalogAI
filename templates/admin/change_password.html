<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password — {{ business.name }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/custom.css">
  <style>
    :root {
      --primary: {{ business.primary_color }};
      --secondary: {{ business.secondary_color }};
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen antialiased">

  <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
    <div class="max-w-2xl mx-auto px-4 h-14 flex items-center justify-between">
      <h1 class="font-bold text-base">Change Password</h1>
      <a href="/admin/{{ slug }}/dashboard"
         class="text-sm text-gray-600 hover:text-gray-900 px-3 py-2 min-h-[44px] flex items-center">← Dashboard</a>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-6">

    {% if saved %}
    <div class="bg-green-50 border border-green-200 text-green-700 text-sm rounded-lg px-4 py-3 mb-4">
      ✅ Password changed successfully.
    </div>
    {% endif %}

    {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3 mb-4">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/admin/{{ slug }}/change-password"
          class="bg-white rounded-xl border border-gray-200 p-5 space-y-5">

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Current password *</label>
        <input type="password" name="current_password" required autofocus
               class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm min-h-[48px]">
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">New password *</label>
        <input type="password" name="new_password" required minlength="8"
               class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm min-h-[48px]">
        <p class="text-xs text-gray-400 mt-1">At least 8 characters.</p>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Confirm new password *</label>
        <input type="password" name="confirm_password" required minlength="8"
               class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm min-h-[48px]">
      </div>

      <button type="submit"
              class="w-full text-white font-bold py-3.5 rounded-lg min-h-[52px]"
              style="background-color: var(--primary)">
        Update Password
      </button>
    </form>
  </main>

</body>
</html>
